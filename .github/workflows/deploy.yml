name: Validate & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for broken local asset paths
        run: python3 scripts/check_links.py

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - id: pages
        uses: actions/configure-pages@v5
      - name: Stage site files
        run: |
          mkdir _site
          cp -r index.html 404.html robots.txt .nojekyll assets _site/
          # Project sites live under /<repo>/ – prefix root-relative paths in 404.html
          BASE="${{ steps.pages.outputs.base_path }}"
          sed -i "s|=\"/|=\"${BASE}/|g" _site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
